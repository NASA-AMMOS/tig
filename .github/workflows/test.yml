name: Test tig-cli

on:
  push:
    branches: ["**"]
    paths:
      - "tig-cli/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "tig-cli/**"
      - ".github/workflows/test.yml"

jobs:
  test:
    name: "Test Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd tig-cli
          python -m pip install --only-binary :all: --require-hashes -r requirements-dev.txt
          python -m pip install --only-binary :all: --no-deps --no-build-isolation -e .

      - name: Run tests
        run: |
          cd tig-cli
          python -m pytest tests/ -v --no-cov -m "not integration"

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          cd tig-cli
          python -m pytest tests/ -m "not integration" --cov=tig_cli --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./tig-cli/coverage.xml
          fail_ci_if_error: false
