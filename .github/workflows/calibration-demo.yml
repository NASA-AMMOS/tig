name: Real Calibration Demo

# Nothing else in CI exercises the calibration path: the product tests build a
# synthetic fixture in-image so they need no calibration and no download.
# ~1.1 GB of downloads, so this is manual or weekly, never on a pull request.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image to run the demo against'
        required: false
        default: 'ghcr.io/nasa-ammos/tig/terrain-intelligence-generator:opensource'
  schedule:
    # Mondays 07:00 UTC
    - cron: '0 7 * * 1'

jobs:
  calibration-demo:
    name: Surface characteristics on real MSL data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || 'ghcr.io/nasa-ammos/tig/terrain-intelligence-generator:opensource' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Before setup-python, and the tool cache is left alone: Python and the
      # tig entry point live in it.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af --volumes
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The demo runs every MARS program through tig, so the CLI is a
      # prerequisite, not an optional convenience.
      - name: Install tig-cli
        run: |
          python -m pip install --only-binary :all: --require-hashes -r tig-cli/requirements.txt
          python -m pip install --only-binary :all: --no-deps --no-build-isolation ./tig-cli

      - name: Run the demo against real VISOR calibration
        run: ./terrain-intelligence-generator/test-calibration-demo.sh "${IMAGE_TAG}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Real calibration demo"
            echo ""
            echo "- Image: \`${IMAGE_TAG}\`"
            echo "- Calibration: \`visor_calibration_20230608_msl.tar.gz\` (VICAR 5.0 release)"
            echo "- Input: real MSL Navcam XYZ from \`visor_sample_data_20230623.tar.gz\`"
            echo "- Demo: \`demo-surface-characteristics.sh\`"
            echo ""
            echo "This path is not run on pull requests: the downloads are ~1.1 GB."
          } >> "$GITHUB_STEP_SUMMARY"
