name: Build and Publish Terrain Intelligence Generator

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
    paths:
      - 'terrain-intelligence-generator/docker/**'
      - '.github/workflows/build-publish-terrain-intelligence-generator.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'terrain-intelligence-generator/docker/**'
      - '.github/workflows/build-publish-terrain-intelligence-generator.yml'
  workflow_dispatch:
    inputs:
      vicar_version:
        description: 'VICAR version to build (GitHub release tag)'
        required: false
        default: '5.0'
      push_to_registry:
        description: 'Push to GitHub Container Registry'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/terrain-intelligence-generator

jobs:
  build-and-push:
    name: Build and Push Terrain Intelligence Generator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          echo ""
          
          # Remove unnecessary pre-installed software
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Clean up docker
          docker system prune -af --volumes
          
          echo ""
          echo "Disk space after cleanup:"
          df -h
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with branch name for branch pushes
            type=ref,event=branch
            # Tag with PR number for pull requests
            type=ref,event=pr
            # Tag with semantic version for tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Tag with 'latest' for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with 'opensource' as a stable identifier
            type=raw,value=opensource
            # Tag with short commit SHA
            type=sha,prefix=sha-,format=short
      
      - name: Determine build arguments
        id: build-args
        run: |
          # Use workflow inputs if provided, otherwise use defaults
          VICAR_VERSION="${{ github.event.inputs.vicar_version }}"
          
          # If not provided, use defaults (5.0 release for pre-built binaries)
          VICAR_VERSION="${VICAR_VERSION:-5.0}"
          
          # Both tarballs are assets of the VICAR_VERSION release and carry its
          # version in their names.
          BINARIES_FILE="vicar_open_bin_x86-64-linx_${VICAR_VERSION}.tar.gz"
          EXTERNAL_FILE="vicar_open_ext_x86-64-linx_${VICAR_VERSION}.tar.gz"
          
          echo "vicar_version=${VICAR_VERSION}" >> $GITHUB_OUTPUT
          echo "binaries_file=${BINARIES_FILE}" >> $GITHUB_OUTPUT
          echo "external_file=${EXTERNAL_FILE}" >> $GITHUB_OUTPUT
          
          echo "Building with:"
          echo "  VICAR version: ${VICAR_VERSION}"
          echo "  Binaries tarball: ${BINARIES_FILE}"
          echo "  Externals tarball: ${EXTERNAL_FILE}"
          echo "  Build method: Pre-built binaries from GitHub releases"
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./terrain-intelligence-generator/docker
          file: ./terrain-intelligence-generator/docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_to_registry != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VICAR_VERSION=${{ steps.build-args.outputs.vicar_version }}
            BINARIES_FILE=${{ steps.build-args.outputs.binaries_file }}
            EXTERNAL_FILE=${{ steps.build-args.outputs.external_file }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Whenever the build is not pushed, load it instead - otherwise the
          # tests below would have no image to run, or a stale published one.
          load: ${{ github.event_name == 'pull_request' || github.event.inputs.push_to_registry == 'false' }}
      
      - name: Generate build summary
        if: always()
        run: |
          echo "## Terrain Intelligence Generator Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Information:**" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch/Tag: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- VICAR Version: \`${{ steps.build-args.outputs.vicar_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "**Test Results:**" >> $GITHUB_STEP_SUMMARY
            echo "✅ 14 comprehensive tests executed" >> $GITHUB_STEP_SUMMARY
            echo "- Container startup and environment" >> $GITHUB_STEP_SUMMARY
            echo "- Directory structure verification (flattening)" >> $GITHUB_STEP_SUMMARY
            echo "- Wrapper scripts (545 commands)" >> $GITHUB_STEP_SUMMARY
            echo "- VICAR operations (gen, list, copy, stretch)" >> $GITHUB_STEP_SUMMARY
            echo "- vicario converter (PNG, JPEG, TIFF)" >> $GITHUB_STEP_SUMMARY
            echo "- VISOR data not bundled (external mount)" >> $GITHUB_STEP_SUMMARY
            echo "- Docker exec pattern (terrain-intelligence-generator)" >> $GITHUB_STEP_SUMMARY
            echo "- File persistence to host" >> $GITHUB_STEP_SUMMARY
            echo "- MARS commands (345 programs)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "**Pull the image:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:opensource" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Run the container:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker run -it --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:opensource bash" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Note:** Image was built successfully but not pushed (pull request)." >> $GITHUB_STEP_SUMMARY
            echo "The terrain product tests ran against the locally built image." >> $GITHUB_STEP_SUMMARY
            echo "The 16 comprehensive tests need the pushed image and run on merge." >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Run comprehensive tests
        if: success() && github.event_name != 'pull_request'
        run: |
          echo "Running comprehensive tests on built image..."
          
          # Clean up build cache before pulling image for tests
          docker builder prune -af
          
          # Get the first tag from the metadata output
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          
          echo "Testing image: ${IMAGE_TAG}"
          echo ""
          
          # Already local when the build was loaded rather than pushed
          docker image inspect "${IMAGE_TAG}" >/dev/null 2>&1 || docker pull "${IMAGE_TAG}"
          
          # Create temporary workspace for testing
          TEST_WORKSPACE=$(mktemp -d)
          echo "Created test workspace: ${TEST_WORKSPACE}"
          
          # Test 1: Container startup
          echo "============================================"
          echo "Test 1: Container startup"
          echo "============================================"
          docker run --rm ${IMAGE_TAG} echo "✓ Container started successfully"
          echo ""
          
          # Test 2: Directory structure verification
          echo "============================================"
          echo "Test 2: Directory structure (flattening)"
          echo "============================================"
          docker run --rm ${IMAGE_TAG} bash -c '
            echo "Checking V2TOP structure..."
            if [ -d "$V2TOP/p2/lib/x86-64-linx" ] && [ -d "$V2TOP/tae53/bin" ] && [ -d "$V2TOP/mars/lib/x86-64-linx" ]; then
              echo "✓ Directory structure is correctly flattened"
              echo "  - p2: $(find $V2TOP/p2/lib/x86-64-linx -type f -executable 2>/dev/null | wc -l) programs"
              echo "  - tae53: $(find $V2TOP/tae53/bin -type f -executable 2>/dev/null | wc -l) programs"
              echo "  - mars: $(find $V2TOP/mars/lib/x86-64-linx -type f -executable 2>/dev/null | wc -l) programs"
            else
              echo "✗ ERROR: Expected directory structure not found"
              exit 1
            fi
          '
          echo ""
          
          # Test 3: Environment variables
          echo "============================================"
          echo "Test 3: Environment variables"
          echo "============================================"
          docker run --rm ${IMAGE_TAG} bash -c '
            echo "V2TOP=$V2TOP"
            echo "WORKSPACE=$WORKSPACE"
            echo "VICSYS=$VICSYS"
            echo "VISOR_CALIB=$VISOR_CALIB"
            echo "VISOR_SAMPLES=$VISOR_SAMPLES"
            
            # Verify required environment variables are set
            if [ -z "$V2TOP" ] || [ -z "$WORKSPACE" ] || [ -z "$VICSYS" ]; then
              echo "✗ ERROR: Required environment variables not set"
              exit 1
            fi
            echo "✓ All environment variables set correctly"
          '
          echo ""
          
          # Test 4: Wrapper scripts
          echo "============================================"
          echo "Test 4: Wrapper scripts"
          echo "============================================"
          docker run --rm ${IMAGE_TAG} bash -c '
            WRAPPER_COUNT=$(ls -1 /usr/local/bin | wc -l)
            echo "Total wrapper scripts: $WRAPPER_COUNT"
            
            # Check for key commands
            for cmd in gen list copy stretch marsmap marsmos vicario; do
              if [ -x "/usr/local/bin/$cmd" ]; then
                echo "✓ $cmd wrapper exists"
              else
                echo "✗ ERROR: $cmd wrapper not found"
                exit 1
              fi
            done
            
            # Verify wrapper script format
            if grep -q "export V2TOP" /usr/local/bin/gen && grep -q "export LD_LIBRARY_PATH" /usr/local/bin/gen; then
              echo "✓ Wrapper scripts have correct format"
            else
              echo "✗ ERROR: Wrapper scripts missing required exports"
              exit 1
            fi
          '
          echo ""
          
          # Test 5: Generate test image
          echo "============================================"
          echo "Test 5: Generate test image (gen command)"
          echo "============================================"
          docker run --rm -v ${TEST_WORKSPACE}:/workspace:Z ${IMAGE_TAG} bash -c '
            gen /workspace/test.vic 256 256
            if [ -f /workspace/test.vic ]; then
              SIZE=$(stat -f%z /workspace/test.vic 2>/dev/null || stat -c%s /workspace/test.vic 2>/dev/null)
              echo "✓ Generated test.vic ($SIZE bytes)"
            else
              echo "✗ ERROR: Failed to generate test image"
              exit 1
            fi
          '
          echo ""
          
          # Test 6: List image contents
          echo "============================================"
          echo "Test 6: List image contents (list command)"
          echo "============================================"
          docker run --rm -v ${TEST_WORKSPACE}:/workspace:Z ${IMAGE_TAG} bash -c '
            # Redirect first: piping into head closes the pipe early and
            # leaves the wrapper blocked on write.
            list /workspace/test.vic > /tmp/list.txt
            status=$?
            head -15 /tmp/list.txt
            if [ $status -eq 0 ]; then
              echo "✓ List command successful"
            else
              echo "✗ ERROR: List command failed"
              exit 1
            fi
          '
          echo ""
          
          # Test 7: Copy operation
          echo "============================================"
          echo "Test 7: Copy image (copy command)"
          echo "============================================"
          docker run --rm -v ${TEST_WORKSPACE}:/workspace:Z ${IMAGE_TAG} bash -c '
            copy /workspace/test.vic /workspace/test_copy.vic
            if [ -f /workspace/test_copy.vic ]; then
              echo "✓ Copy command successful"
            else
              echo "✗ ERROR: Copy command failed"
              exit 1
            fi
          '
          echo ""
          
          # Test 8: Stretch operation
          echo "============================================"
          echo "Test 8: Stretch image (stretch command)"
          echo "============================================"
          docker run --rm -v ${TEST_WORKSPACE}:/workspace:Z ${IMAGE_TAG} bash -c '
            stretch /workspace/test.vic /workspace/stretched.vic
            if [ -f /workspace/stretched.vic ]; then
              echo "✓ Stretch command successful"
            else
              echo "✗ ERROR: Stretch command failed"
              exit 1
            fi
          '
          echo ""
          
          # Test 9: vicario converter (PNG)
          echo "============================================"
          echo "Test 9: vicario converter (VICAR to PNG)"
          echo "============================================"
          docker run --rm -v ${TEST_WORKSPACE}:/workspace:Z ${IMAGE_TAG} bash -c '
            vicario /workspace/test.vic /workspace/test.png
            if [ -f /workspace/test.png ]; then
              echo "✓ PNG conversion successful"
            else
              echo "✗ ERROR: PNG conversion failed"
              exit 1
            fi
          '
          echo ""
          
          # Test 10: vicario converter (JPEG)
          echo "============================================"
          echo "Test 10: vicario converter (VICAR to JPEG)"
          echo "============================================"
          docker run --rm -v ${TEST_WORKSPACE}:/workspace:Z ${IMAGE_TAG} bash -c '
            vicario /workspace/test.vic /workspace/test.jpg
            if [ -f /workspace/test.jpg ]; then
              echo "✓ JPEG conversion successful"
            else
              echo "✗ ERROR: JPEG conversion failed"
              exit 1
            fi
          '
          echo ""
          
          # Test 11: Verify VISOR data is NOT bundled (should be mounted at runtime)
          echo "============================================"
          echo "Test 11: VISOR data not bundled"
          echo "============================================"
          docker run --rm ${IMAGE_TAG} bash -c '
            if [ ! -d "$VISOR_SAMPLES" ] && [ ! -d "$VISOR_CALIB" ]; then
              echo "✓ VISOR data not bundled (mount at runtime as documented)"
            else
              echo "✗ WARNING: VISOR data found in image (should be external)"
              [ -d "$VISOR_SAMPLES" ] && echo "  - VISOR_SAMPLES exists"
              [ -d "$VISOR_CALIB" ] && echo "  - VISOR_CALIB exists"
            fi
          '
          echo ""
          
          # Test 12: Docker exec pattern (tig-cli sidecar simulation)
          echo "============================================"
          echo "Test 12: Docker exec pattern (long-running container)"
          echo "============================================"
          docker run -d --name vicar-test-container -v ${TEST_WORKSPACE}:/workspace:Z ${IMAGE_TAG} tail -f /dev/null
          sleep 2
          
          docker exec vicar-test-container gen /workspace/exec_test.vic 128 128
          if ! docker exec vicar-test-container test -f /workspace/exec_test.vic; then
            echo "✗ ERROR: gen command failed in exec pattern"
            docker stop vicar-test-container && docker rm vicar-test-container
            exit 1
          fi
          echo "✓ gen via docker exec"
          
          docker exec vicar-test-container list /workspace/exec_test.vic
          echo "✓ list via docker exec"
          
          docker exec vicar-test-container vicario /workspace/exec_test.vic /workspace/exec_test.png
          if ! docker exec vicar-test-container test -f /workspace/exec_test.png; then
            echo "✗ ERROR: vicario command failed in exec pattern"
            docker stop vicar-test-container && docker rm vicar-test-container
            exit 1
          fi
          echo "✓ vicario via docker exec"
          
          echo "✓ Docker exec pattern works correctly"
          docker stop vicar-test-container
          docker rm vicar-test-container
          echo ""
          
          # Test 13: File persistence verification
          echo "============================================"
          echo "Test 13: File persistence to host"
          echo "============================================"
          echo "Files created in test workspace:"
          ls -lh ${TEST_WORKSPACE}
          
          # Verify all expected files exist
          EXPECTED_FILES="test.vic test_copy.vic stretched.vic test.png test.jpg exec_test.vic exec_test.png"
          ALL_FOUND=true
          for file in $EXPECTED_FILES; do
            if [ -f "${TEST_WORKSPACE}/${file}" ]; then
              echo "✓ ${file} exists on host"
            else
              echo "✗ ERROR: ${file} not found on host"
              ALL_FOUND=false
            fi
          done
          
          if [ "$ALL_FOUND" = false ]; then
            exit 1
          fi
          echo ""
          
          # Test 14: MARS commands availability
          echo "============================================"
          echo "Test 14: MARS commands availability"
          echo "============================================"
          docker run --rm ${IMAGE_TAG} bash -c '
            MARS_COUNT=$(ls /usr/local/bin | grep -c "^mars")
            echo "MARS commands available: $MARS_COUNT"
            
            # Check for key MARS commands
            for cmd in marsmap marsmos marsautotie marscor3; do
              if [ -x "/usr/local/bin/$cmd" ]; then
                echo "✓ $cmd available"
              else
                echo "✗ ERROR: $cmd not found"
                exit 1
              fi
            done
          '
          echo ""
          
          # Test 15: Exit code translation
          echo "============================================"
          echo "Test 15: Exit codes usable from a shell"
          echo "============================================"
          docker run --rm ${IMAGE_TAG} bash -c '
            check() {
              expected=$1; description=$2; shift 2
              "$@" > /dev/null 2>&1
              actual=$?
              if [ "$actual" -eq "$expected" ]; then
                echo "✓ $description exits $actual"
              else
                echo "✗ ERROR: $description exits $actual, expected $expected"
                exit 1
              fi
            }

            # VICAR returns 1 on success and 1 again when TAE rejects the
            # invocation; the wrappers must separate those for shell callers.
            check 0 "a successful run" gen /tmp/codes.vic 8 8
            check 1 "an unknown keyword" gen OUT=/tmp/codes.vic NL=8 NS=8 NOSUCHPARAM=1
            check 1 "a missing parameter" copy
            check 255 "a missing input file" list /tmp/definitely-absent.vic

            # The wrappers must be ahead of the program directories on PATH,
            # or none of the above applies to what users actually run.
            for cmd in gen copy list marsmap xvd; do
              resolved=$(command -v $cmd)
              if [ "$resolved" != "/usr/local/bin/$cmd" ]; then
                echo "✗ ERROR: $cmd resolves to $resolved, bypassing its wrapper"
                exit 1
              fi
            done
            echo "✓ Wrappers take precedence on PATH"

            # set -e pipelines are the reason this matters
            set -e
            gen /tmp/chain.vic 8 8 > /dev/null && copy INP=/tmp/chain.vic OUT=/tmp/chain2.vic > /dev/null
            echo "✓ A set -e pipeline of VICAR commands completes"
          '
          echo ""

          # Same contract on a terminal, where the wrapper has to keep the
          # program's stdout a tty (prompts, Motif) instead of piping it.
          docker run --rm -t ${IMAGE_TAG} bash -c '
            check() {
              expected=$1; description=$2; shift 2
              "$@" > /dev/tty 2>&1
              actual=$?
              if [ "$actual" -eq "$expected" ]; then
                echo "✓ $description exits $actual on a tty" >> /tmp/results
              else
                echo "✗ ERROR: $description exits $actual on a tty, expected $expected" >> /tmp/results
                exit 1
              fi
            }
            : > /tmp/results
            check 0 "a successful run" gen /tmp/codes.vic 8 8
            check 1 "an unknown keyword" gen OUT=/tmp/codes.vic NL=8 NS=8 NOSUCHPARAM=1
            check 1 "a missing parameter" copy
            check 255 "a missing input file" list /tmp/definitely-absent.vic

            # The pty must not swallow a caller-redirected stderr
            /usr/local/libexec/vicar-run /bin/sh -c "echo diagnostic >&2" > /dev/tty 2> /tmp/stderr.txt
            if grep -q diagnostic /tmp/stderr.txt; then
              echo "✓ stderr still goes where the caller redirected it" >> /tmp/results
            else
              echo "✗ ERROR: redirected stderr was lost" >> /tmp/results
              cat /tmp/results
              exit 1
            fi
            cat /tmp/results
          '
          echo ""

          # Test 16: MPI-linked programs start
          echo "============================================"
          echo "Test 16: MPI-linked programs reach TAE argument checking"
          echo "============================================"
          # These four link MPICH, whose bundled hwloc used to raise SIGFPE in
          # MPI_Init; exit 1 means TAE rejected the invocation, >128 a signal.
          docker run --rm ${IMAGE_TAG} bash -c '
            for cmd in marsmap marscor2 marsint marsremos; do
              $cmd > /dev/null 2>&1
              code=$?
              if [ "$code" -eq 1 ]; then
                echo "✓ $cmd exits 1 (TAE rejected the invocation)"
              else
                echo "✗ ERROR: $cmd exits $code, expected 1"
                exit 1
              fi
            done
          '
          echo ""

          # Cleanup
          rm -rf ${TEST_WORKSPACE}
          echo "============================================"
          echo "✅ ALL TESTS PASSED"
          echo "============================================"

      # On a pull request nothing has pruned the build cache yet, and the
      # loaded image has to fit next to it.
      - name: Reclaim disk before the product tests
        if: success() && github.event_name == 'pull_request'
        run: |
          docker builder prune -af
          df -h /

      # Asserts terrain product content from a synthetic in-image fixture (no
      # calibration, ~9s).  Runs on pull requests too - the image is loaded above.
      - name: Run terrain product tests
        if: success()
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          ./terrain-intelligence-generator/test-product-pipeline.sh "${IMAGE_TAG}"

  # Optional: Create GitHub Release for tagged versions
  create-release:
    name: Create GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create Release Notes
        id: release-notes
        run: |
          cat > release-notes.md << 'EOF'
          ## Terrain Intelligence Generator - Open Source Edition
          
          This release provides a containerized version of the VICAR-based terrain intelligence generation system built from pre-built binaries distributed via GitHub releases.
          
          ### What's Included
          - VICAR image processing tools (pre-built binaries)
          - TAE (Terminal Application Executive)
          - MARS terrain processing tools
           - Vicario (Java) - VICAR to PNG/JPEG/TIFF converter
           - Runtime-ready for external calibration/data mounts
           - All necessary runtime dependencies
          
          ### Quick Start
          
          **Pull the image:**
          ```bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          ```
          
          **Run interactively:**
          ```bash
          docker run -it --rm \
            -v $(pwd)/workspace:/workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            bash
          ```
          
          **Test VICAR commands:**
          ```bash
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            bash -c 'cd /tmp && gen out=test.img nl=10 ns=10 && label -list inp=test.img'
          ```
          
          **Convert VICAR images:**
          ```bash
          docker run --rm -v $(pwd):/workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            vicario input.vic output.png
          ```
          
          ### Available Tags
          - `${{ github.ref_name }}` - This specific version
          - `opensource` - Latest open-source build
          - `latest` - Latest stable release
          
          ### Mount Points for External Data
          Mount calibration/sample data at runtime:
          - VISOR calibrations: `-v /path/to/calib:/usr/local/vicar/visor_calib:ro`
          - VISOR samples: `-v /path/to/samples:/usr/local/vicar/visor_samples:ro`
          - MARS calibration: `-v /path/to/mars_calib:/usr/local/vicar/mars_calib:ro`
          
          See Dockerfile comments for download instructions.
          
          ### Source Code
          - VICAR: https://github.com/NASA-AMMOS/VICAR
          - Pre-built binaries from release: ${{ github.event.inputs.vicar_version || '5.0' }}
          - Built from commit: ${{ github.sha }}
          
          ### Documentation
          See the [terrain-intelligence-generator README](terrain-intelligence-generator/README.md) for detailed usage instructions.
          EOF
      
      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A release created with GITHUB_TOKEN raises no workflow event, so the release
  # sign-off suite is called from here instead of waiting for one.
  release-visual-regression:
    name: Release Visual Regression
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/release-visual-regression.yml
    secrets: inherit
