name: Publish tig-cli

# Publishes the `tig-cli` package to PyPI (or TestPyPI) using PyPI Trusted
# Publishing (OIDC) — no long-lived API tokens are stored in the repo.
#
# How to cut a release:
#   1. Bump `version` in tig-cli/pyproject.toml (and __version__ in
#      src/tig_cli/__init__.py) on the default branch.
#   2. Tag the commit with `tig-cli-v<version>` (e.g. tig-cli-v0.1.0) and push
#      the tag. The tag version MUST match pyproject.toml or the build fails.
#   3. This workflow builds, verifies, and publishes to PyPI.
#
# To do a dry run to TestPyPI, use the "Run workflow" button
# (workflow_dispatch) with target = testpypi.

on:
  push:
    tags:
      # Component-scoped tag so this never fires for the Docker image `v*` tags.
      - "tig-cli-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

defaults:
  run:
    working-directory: tig-cli

jobs:
  test:
    name: "Test Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev deps
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements-dev.txt
          python -m pip install --only-binary :all: --no-deps --no-build-isolation -e .

      - name: Run unit tests
        run: python -m pytest tests/ -v --no-cov -m "not integration"

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#tig-cli-v}"
          pkg_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "Tag version:     $tag_version"
          echo "Package version: $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject version '${pkg_version}'."
            exit 1
          fi

      - name: Install build tooling
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements-release.txt

      - name: Build sdist and wheel
        run: python -m build --no-isolation

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tig-cli-dist
          path: tig-cli/dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: tig-cli-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/tig-cli-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: tig-cli-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
