name: Release Visual Regression

# Release-gated only: the suite runs the shipped demo pipelines on real MSL
# VISOR frames (~8 min, 1.1 GB of pinned data), so it is deliberately kept off
# the pull_request and push paths.  test-product-pipeline.sh remains the
# synthetic, per-change product test.
on:
  # build-publish cuts releases with GITHUB_TOKEN, and those releases raise no
  # workflow event, so that workflow calls this one after the release is created.
  workflow_call:
    inputs:
      image_tag:
        description: 'TIG image to test'
        required: false
        type: string
        default: ''
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "TIG image to test (empty: this repository's :opensource)"
        required: false
        default: ''

# contents: write only for the release upload; packages: read for the GHCR pull.
permissions:
  contents: write
  packages: read

jobs:
  release-visual-regression:
    name: Visual regression on real VISOR data
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the tig CLI
        run: |
          python -m pip install --only-binary :all: --require-hashes -r tig-cli/requirements.txt
          python -m pip install --only-binary :all: --no-deps --no-build-isolation ./tig-cli

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        # Dispatch input and release tag come in as env, never interpolated into
        # the script body.
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          # A workflow_call from the tag push has no release payload yet; only a
          # tag ref names a version, a branch dispatch falls through to :opensource.
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          # A repository owner may be mixed case; an image reference may not.
          IMAGE="$(echo "ghcr.io/${{ github.repository }}/terrain-intelligence-generator" | tr '[:upper:]' '[:lower:]')"
          TAG="${INPUT_TAG}"
          # On a release, sign off the image built for that tag; :opensource
          # floats across every pushed build, so it may be a different one.
          if [ -z "${TAG}" ]; then
            VERSION="${RELEASE_TAG}"
            VERSION="${VERSION#v}"
            if [ -n "${VERSION}" ] && docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              TAG="${IMAGE}:${VERSION}"
            else
              echo "::warning::no ${IMAGE}:${VERSION} image for this release; testing :opensource instead"
              TAG="${IMAGE}:opensource"
            fi
          fi
          echo "testing ${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Free disk space for the VISOR data and image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Restore cached VISOR sample data and MSL calibration
        id: visor-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/visor_data
          key: visor-msl-sample-20230623-calib-20230608

      - name: Run the release visual regression suite
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          ./terrain-intelligence-generator/test-release-regression.sh \
            "${IMAGE_TAG}" \
            --download \
            --out-dir "${GITHUB_WORKSPACE}/release-regression"

      # Save only after a green run, so a cancelled or half-extracted download
      # cannot occupy the key and fail every later run.
      - name: Cache the VISOR data
        if: success() && steps.visor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/visor_data
          key: visor-msl-sample-20230623-calib-20230608

      - name: Upload report and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-visual-regression
          path: |
            release-regression/report.md
            release-regression/images/**
            release-regression/scratch/**/*.log
          # A hard failure (missing data or calibration) exits before the
          # out-dir exists; the FATAL message is the signal, not this step.
          if-no-files-found: warn

      - name: Attach the report to the release
        # A dispatch on a tag has no release to upload to, so it is excluded.
        if: github.event_name == 'release' || (github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
        run: |
          cd release-regression
          tar -czf release-visual-regression.tar.gz report.md images
          gh release upload "${RELEASE_TAG}" \
            release-visual-regression.tar.gz --clobber
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
