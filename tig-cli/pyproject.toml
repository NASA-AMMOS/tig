[project]
name = "tig-cli"
version = "0.2.0"
description = "TIG CLI for running VICAR commands in a container"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]
authors = [
    {name = "NASA AMMOS", email = "ammos@jpl.nasa.gov"}
]
readme = "README.md"
license = {text = "Apache-2.0"}

[project.scripts]
tig = "tig_cli.entry:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

# Build and release tooling for CI, which builds with --no-build-isolation.
# Everything is locked in uv.lock; CI installs from the hash-pinned exports
# requirements.txt, requirements-dev.txt and requirements-release.txt. After
# changing any dependency, run `uv lock` and the `uv export` command recorded
# at the top of each requirements file.
[dependency-groups]
backend = [
    "setuptools>=61.0",
    "wheel",
]
release = [
    "build",
    "twine",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=tig_cli --cov-report=term-missing"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
