apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-definitions
  namespace: tig-airflow
data:
  # Pre-declared so MinIO can publish before the listener is running.
  definitions.json: |
    {
      "users": [
        {"name": "guest", "password": "guest", "tags": ["administrator"]}
      ],
      "vhosts": [{"name": "/"}],
      "permissions": [
        {"user": "guest", "vhost": "/", "configure": ".*", "write": ".*", "read": ".*"}
      ],
      "exchanges": [
        {"name": "ids-events", "vhost": "/", "type": "fanout", "durable": true, "auto_delete": false}
      ],
      "queues": [
        {"name": "ids-fdr-queue", "vhost": "/", "durable": true, "auto_delete": false}
      ],
      "bindings": [
        {"source": "ids-events", "vhost": "/", "destination": "ids-fdr-queue",
         "destination_type": "queue", "routing_key": ""}
      ]
    }
  rabbitmq.conf: |
    loopback_users = none
    load_definitions = /etc/rabbitmq/definitions.json
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: tig-airflow
spec:
  type: ClusterIP
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  selector:
    app: rabbitmq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: tig-airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management
        ports:
        - containerPort: 5672
        - containerPort: 15672
        volumeMounts:
        - name: config
          mountPath: /etc/rabbitmq/rabbitmq.conf
          subPath: rabbitmq.conf
        - name: config
          mountPath: /etc/rabbitmq/definitions.json
          subPath: definitions.json
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: rabbitmq-definitions
