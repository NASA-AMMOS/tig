apiVersion: batch/v1
kind: Job
metadata:
  name: ids-seed
  namespace: tig-airflow
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: seed
        image: minio/mc:RELEASE.2024-11-21T17-21-54Z
        command: ["/bin/sh", "/scripts/seed.sh"]
        env:
        - name: MINIO_ENDPOINT
          value: "http://minio.tig-airflow.svc.cluster.local:9000"
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
        volumeMounts:
        - name: seed-script
          mountPath: /scripts
        - name: sample-data
          mountPath: /data
          readOnly: true
      volumes:
      - name: seed-script
        configMap:
          name: seed-script
          defaultMode: 0755
      - name: sample-data
        hostPath:
          path: /mnt/sample-data
          type: Directory
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-script
  namespace: tig-airflow
data:
  seed.sh: |
    #!/bin/sh
    set -e

    BUCKET="ids-pipeline"
    # Target id matches the MINIO_NOTIFY_AMQP_*_RABBITMQ env vars on the MinIO pod.
    NOTIFY_ARN="arn:minio:sqs::RABBITMQ:amqp"

    echo "=== Configuring mc alias ==="
    mc alias set minio "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

    echo "=== Creating bucket ==="
    mc mb --ignore-existing "minio/$BUCKET"

    echo "=== Subscribing bucket to RabbitMQ (ObjectCreated, *.VIC) ==="
    mc event remove "minio/$BUCKET" "$NOTIFY_ARN" --event put --suffix .VIC --force 2>/dev/null || true
    mc event add "minio/$BUCKET" "$NOTIFY_ARN" --event put --suffix .VIC
    mc event list "minio/$BUCKET"

    echo "=== Uploading sample FDR files ==="
    mc cp /data/NLM_1835_0829848458_777FDR_N0874924NCAM00230_0A02LLJ01.VIC "minio/$BUCKET/global_cache/1835/ncam/"
    mc cp /data/NRM_1835_0829848458_777FDR_N0874924NCAM00230_0A02LLJ01.VIC "minio/$BUCKET/global_cache/1835/ncam/"

    echo "=== Seed complete ==="
    echo "Bucket: s3://$BUCKET  (endpoint $MINIO_ENDPOINT)"
    echo "Events: $NOTIFY_ARN -> exchange ids-events -> queue ids-fdr-queue"
