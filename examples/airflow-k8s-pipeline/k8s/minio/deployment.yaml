apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: tig-airflow
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: tig-airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      automountServiceAccountToken: false
      # MinIO validates the AMQP target at startup, so wait for the broker.
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z rabbitmq.tig-airflow.svc.cluster.local 5672; do sleep 2; done"]
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-12-18T13-15-44Z
        args: ["server", "/data", "--console-address", ":9001"]
        ports:
        - containerPort: 9000
        - containerPort: 9001
        env:
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
        # Bucket notification target "RABBITMQ" -> arn:minio:sqs::RABBITMQ:amqp
        - name: MINIO_NOTIFY_AMQP_ENABLE_RABBITMQ
          value: "on"
        - name: MINIO_NOTIFY_AMQP_URL_RABBITMQ
          value: "amqp://guest:guest@rabbitmq.tig-airflow.svc.cluster.local:5672"
        - name: MINIO_NOTIFY_AMQP_EXCHANGE_RABBITMQ
          value: "ids-events"
        - name: MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_RABBITMQ
          value: "fanout"
        - name: MINIO_NOTIFY_AMQP_DURABLE_RABBITMQ
          value: "on"
        - name: MINIO_NOTIFY_AMQP_DELIVERY_MODE_RABBITMQ
          value: "2"
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "1Gi"
            cpu: "500m"
            # Covers the /data emptyDir, which holds every object in the demo bucket
            # (~260 MiB per stereo-pair run); half of minikube's default 20 GB disk.
            ephemeral-storage: "10Gi"
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 10Gi
